name: Update data

on:
  schedule:
    # Twice a day. EIA publishes the weekly SPR figure on Wednesdays at
    # 10:30 a.m. Eastern, so the afternoon run picks it up the same day.
    - cron: "17 15,22 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test parsers
        run: npm test

      - name: Scrape EIA
        run: node scraper/run.js

      - name: Render share card
        run: node scripts/card.js
        continue-on-error: true

      # Commit only when a reading or the card changed; the message says what
      # changed, and the push redeploys the site on Vercel. index.json's check
      # time moves every run, so it rides along with real changes instead of
      # making a commit of its own.
      - name: Commit new readings
        run: |
          if git diff --quiet -- public ':(exclude)public/data/index.json'; then
            echo "No new readings"
          else
            git config user.name "spr-scraper[bot]"
            git config user.email "noreply@github.com"
            git add public
            git commit -m "$(node scripts/commit-message.js)"
            git push
          fi
